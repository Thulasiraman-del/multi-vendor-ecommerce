services:
  db:
    image: postgres:17
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: multivendor_db
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d multivendor_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: ecommerce-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env}
      SECRET_KEY: ${DOCKER_SECRET_KEY:?Set DOCKER_SECRET_KEY in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
